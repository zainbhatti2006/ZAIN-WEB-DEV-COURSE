<!-- In this lecture, we will learn about JavaScript Event Bubbling and how to handle them. -->
<!-- And also we will learn about setInterval and setTimeout functions in JavaScript. -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Bubbling</title>
    <style>
      .child {
        background-color: lightblue;
        border: 2px solid black;
        padding: 34px;
        margin: 34px;
        cursor: pointer;
      }
      .childContainer {
        background-color: lightgreen;
        border: 2px solid black;
        padding: 34px;
        margin: 34px;
      }
      .container {
        background-color: yellow;
        border: 2px solid black;
        padding: 34px;
        margin: 34px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="childContainer">
        <div class="child">I am a child</div>
      </section>
    </div>
    <script>
      const container = document.querySelector(".container");
      const childContainer = document.querySelector(".childContainer");
      const child = document.querySelector(".child");

      container.addEventListener("click", (e) => {
        e.stopPropagation();
        alert("Container Clicked");
      });

      childContainer.addEventListener("click", (e) => {
        e.stopPropagation();
        alert("Child Container Clicked");
      });

      child.addEventListener("click", (e) => {
        e.stopPropagation();
        alert("Child Clicked");
      });

      function getRandomColor() {
        let val1 = Math.floor(Math.random() * 255);
        let val2 = Math.floor(Math.random() * 255);
        let val3 = Math.floor(Math.random() * 255);
        return `rgb(${val1}, ${val2}, ${val3})`;
      }

      //   let a = setInterval(() => {
      //     document.querySelector(".childContainer").style.backgroundColor =
      //       getRandomColor();
      //   }, 1000);
      //   console.log(a);

      let a = setTimeout(() => {
        document.querySelector(".childContainer").style.backgroundColor =
          getRandomColor();
      }, 5000);
      console.log(a);

    </script>
  </body>
</html>
